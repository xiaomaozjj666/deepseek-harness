# pi-ai route and isolated-path patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      deepseek:
        apiKeyEnv: DEEPSEEK_API_KEY
        baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
        reasoning: low
        modelOverrides:
          deepseek-flash:
            maxTokens: 1024
        # This case proves the pi-ai route's compatibility defaults, not idle
        # detection: the fixture server holds the stream open with comments
        # until the title request arrives, and a saturated shared runner can
        # stall the event loop for over a second, which a 1000 ms budget turned
        # into a replayed request.
        streamIdleTimeoutMs: 5000

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek
        model: deepseek-flash
        cwd: !!js process.cwd()

- id: agent-instructions
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
