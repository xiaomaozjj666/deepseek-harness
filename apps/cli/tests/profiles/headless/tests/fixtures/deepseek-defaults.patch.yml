# Local endpoint and isolated-path patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  config:
    baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
    thinking: enabled
    reasoningEffort: low
    # The fixture server emits comment heartbeats every 100 ms and only
    # answers after six of them, so this budget still proves the comments keep
    # the stream alive. It also leaves 300 ms of jitter headroom: a 150 ms
    # budget tripped the idle watchdog on an oversubscribed shared runner,
    # and the provider's default retry policy replayed the whole request.
    streamIdleTimeoutMs: 400

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: agent-instructions
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
