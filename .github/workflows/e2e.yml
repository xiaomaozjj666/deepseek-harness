name: E2E (real DeepSeek API)

# Real-API end-to-end suite (`pnpm run test:e2e`). Unlike ci.yml this job
# consumes the DEEPSEEK_API_KEY_EXTERNAL secret (mapped to the env var
# DEEPSEEK_API_KEY the tests read) and hits the external API at
# https://api.deepseek.com/anthropic (DEEPSEEK_BASE_URL is pinned explicitly so a
# stray repo-root .env can't redirect the run).
#
# pull_request IS a trigger, but GitHub withholds repo secrets from BOTH forked
# PRs and Dependabot PRs (the latter are same-repo, fork==false, but still
# keyless). The job-level `if:` below skips the whole job for those untrusted
# PRs. The Dependabot test keys on the PR AUTHOR (pull_request.user.login), not
# github.actor (the run trigger) — a maintainer reopening a Dependabot PR would
# make github.actor human while the PR is still keyless. When the job runs, the
# secret is expected, so the preflight hard-fails if it's missing (a missing
# secret would otherwise make the self-skipping suite report a false green). A
# job skipped by a job-level `if:` reports as a SUCCESSFUL check, so this
# workflow is safe to use as a required status check if desired.
#
# SECURITY — NEVER change this trigger to `pull_request_target`. `pull_request`
# checks out and runs the PR's HEAD code WITHOUT secrets for forks, which is what
# keeps an untrusted fork from exfiltrating the key. `pull_request_target` runs
# in the BASE repo's context WITH secrets while still able to check out untrusted
# fork code — a textbook key-leak vector, especially once this repo is public.
# The fork/secret model and its public-repo implications are recorded in
# .agents/notes/implemented/testing/2026-06-19-real-api-e2e-ci.md.
#
# Note: scheduled triggers are auto-disabled after 60 days of repo inactivity;
# push/pull_request/workflow_dispatch act as backstops.
#
# PROVIDER OUTAGE vs TEST VERDICT — this workflow answers two different
# questions, and only one of them is about this repository's code:
#   * the credential/model endpoint answers and the suite passes or fails on
#     assertions → that is the verdict, and an assertion failure is a real red;
#   * the endpoint refuses to serve (HTTP 402 `QUOTA`/insufficient balance,
#     429, 5xx, or no connection at all) → every model call fails for reasons
#     no commit can fix, and retries only multiply the same refusal. The
#     availability probe below classifies that case, skips the suite, and
#     reports a green run whose step summary and `::warning::` state that NO
#     TEST VERDICT WAS REACHED plus how to re-run. Retrying an outage is not
#     more truthful than naming it, so the run stays green-but-explicit rather
#     than red-on-noise or silently green.
# A rejected credential (401/403) is NOT an outage: that is a broken secret, so
# the probe hard-fails and the job is red.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Fork policy: weekly heartbeat (upstream runs this nightly against their own key;
    # here it spends the fork owner's DEEPSEEK_API_KEY_EXTERNAL, so keep it 7x cheaper).
    # 00:17 UTC Monday = 08:17 Asia/Shanghai — off the top-of-hour cron stampede.
    - cron: '17 0 * * 1'

# Keep only the newest validation in each workflow/ref, including master
# pushes, nightly runs, and manual dispatches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only reads the repo to run tests.
permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'blacksmith'
          && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    name: e2e
    # Run on every trusted event. Skip untrusted PRs (forks + Dependabot) where
    # the secret is withheld — they would otherwise hard-fail the preflight.
    if: >-
      github.event_name != 'pull_request'
      || !(github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]')
    # Profile e2e files can each own several complete dsh subprocess trees, so
    # four file workers preserve process/PTY headroom. Tests retain 120s/test
    # and retry 2; 45m still bounds retry storms against a slow API.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The with-key escalation e2e self-skips without a usable runner. Prepare
      # bwrap so trusted CI exercises it; the functional probe remains the
      # authority on whether the runner can use the sandbox.
      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      # Guard against a false green: the e2e suites self-skip when the key is
      # absent, so a missing/misconfigured secret would otherwise pass as
      # "all skipped". This job only runs on trusted events (the `if:` above
      # excludes keyless PRs), so the secret MUST be present — fail loudly if not.
      - name: Preflight (require DEEPSEEK_API_KEY)
        env:
          # Repo secret DEEPSEEK_API_KEY_EXTERNAL holds the external-API key;
          # the tests read process.env.DEEPSEEK_API_KEY, so map it across here.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::DEEPSEEK_API_KEY is empty. The e2e suite would self-skip and"
            echo "::error::report a false green. Configure the repo secret DEEPSEEK_API_KEY_EXTERNAL."
            exit 1
          fi
          echo "DEEPSEEK_API_KEY present."

      # The suite's own retries (vitest `retry: 2`) cannot tell "the model
      # answered and the assertion is wrong" apart from "the provider refused
      # every call". Probe once before spending ~10 minutes of retries: an
      # outage is then reported as an outage instead of surfacing as dozens of
      # empty-output assertion failures. 401/403 stays a hard failure because a
      # rejected credential is a broken secret, not a provider outage.
      - name: Probe external API availability
        id: probe
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          set -u
          body="$(mktemp)"
          status="$(curl -sS -o "$body" -w '%{http_code}' --max-time 90 \
            -H "x-api-key: ${DEEPSEEK_API_KEY}" \
            -H 'content-type: application/json' \
            -H 'anthropic-version: 2023-06-01' \
            --data '{"model":"deepseek-flash","max_tokens":1,"messages":[{"role":"user","content":[{"type":"text","text":"Reply with OK."}]}]}' \
            'https://api.deepseek.com/anthropic/v1/messages')" || status='000'
          reason="$(tr '\n' ' ' < "$body" | head -c 400)"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          case "$status" in
            200)
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "External API answered HTTP 200."
              ;;
            401|403)
              echo "::error::The external API rejected the credential (HTTP ${status}); fix the DEEPSEEK_API_KEY_EXTERNAL secret: ${reason}"
              exit 1
              ;;
            402|429|5??|000)
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::warning::The external API cannot serve test calls right now (HTTP ${status}): ${reason}"
              ;;
            *)
              echo "::error::Unexpected availability-probe response (HTTP ${status}): ${reason}"
              exit 1
              ;;
          esac

      # The e2e suites boot the example bins in `lib` mode (DSH_EXAMPLE_MODE=lib):
      # the built artifact under plain Node, resolving plugins through real package
      # exports — the shape a real consumer runs. That requires a prior build.
      - name: Build (lib for the e2e example bins)
        if: steps.probe.outputs.available == 'true'
        run: ${{ github.event_name == 'pull_request' && 'pnpm run build:artifacts --profile official' || 'pnpm run build:official' }}

      - name: Prepare Office runtime
        if: steps.probe.outputs.available == 'true'
        run: pnpm run prepare:primary-runtime --target linux-x64 --output .cache/e2e-office

      # Real-API end-to-end tests only. The keyless gates (lint/typecheck/
      # coverage/snapshot/etc.) already run in ci.yml (pull requests) and
      # ci-master.yml (master push standby).
      # DEEPSEEK_BASE_URL is pinned to the external API; the secret is scoped to
      # this step (and preflight) only — never exposed to checkout/setup/install.
      - name: E2E tests (real DeepSeek API)
        id: e2e
        # Skipped only when the probe classified a provider outage; in every
        # other case this step runs and its result is the actual verdict.
        if: steps.probe.outputs.available == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com/anthropic
          DSH_PRIMARY_RUNTIME: ${{ github.workspace }}/.cache/e2e-office/primary-runtime
          DSH_E2E_MAX_WORKERS: 6
          DSH_EXAMPLE_MODE: lib
        run: pnpm run test:e2e

      # Green, but explicitly NOT a verdict: keep the run from turning red on
      # provider/account noise while refusing to let it pass silently. The
      # summary carries the probe evidence and the exact re-run command.
      - name: Report provider outage instead of a test verdict
        if: steps.probe.outputs.available != 'true'
        env:
          PROBE_STATUS: ${{ steps.probe.outputs.status }}
          PROBE_REASON: ${{ steps.probe.outputs.reason }}
        run: |
          {
            echo '## E2E skipped: external API unavailable (no test verdict)'
            echo ''
            echo "Probe: HTTP ${PROBE_STATUS} — \`${PROBE_REASON}\`"
            echo ''
            echo 'The suite proves nothing in this state: every model call would fail for'
            echo 'provider or account reasons that no commit can fix, and retrying a refusal'
            echo 'only repeats it. The suite was skipped rather than run into a retry storm, so'
            echo 'this job is green only as an outage classification — not as a verdict.'
            echo ''
            echo 'Re-run once the provider recovers (same commit, no code change needed):'
            echo '```'
            echo 'gh workflow run e2e.yml --ref master -R xiaomaozjj666/deepseek-harness'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::E2E suite skipped: external API unavailable (HTTP ${PROBE_STATUS}). Outage classification, not a test verdict; see the run summary for the re-run command."
